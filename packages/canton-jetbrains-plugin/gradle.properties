pluginGroup = com.moonsonglabs.daml
pluginName = canton-jetbrains-plugin
pluginVersion = 0.3.0

# IntelliJ IDEA Community as the target SDK so the plugin runs in any JetBrains IDE >= 2025.2.
platformType = IC
platformVersion = 2025.2.6.2

# 252 = 2025.2; leave untilBuild empty for an unbounded upper bound.
pluginSinceBuild = 252
pluginUntilBuild =

# LSP4IJ provides the LSP integration; pinned to a verified-stable release.
lsp4ijVersion = 0.19.3

# JDK 21 is required by IntelliJ Platform 2025.2+.
javaVersion = 21
kotlinVersion = 2.1.20

# Platform bundles its own Kotlin stdlib; do not ship our own.
kotlin.stdlib.default.dependency = false

# Faster Gradle.
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -XX:+UseG1GC
