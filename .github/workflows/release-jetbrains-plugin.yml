name: Release JetBrains Plugin

on:
  push:
    tags:
      - "canton-jetbrains-plugin-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version to release, for example 0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/canton-jetbrains-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF_NAME#canton-jetbrains-plugin-v}"
            if [[ "$VERSION" == *-* ]]; then PRERELEASE="true"; else PRERELEASE="false"; fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=canton-jetbrains-plugin-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set Gradle plugin version
        run: |
          perl -0pi -e 's/^pluginVersion = .*/pluginVersion = $ENV{PLUGIN_VERSION}/m' gradle.properties
        env:
          PLUGIN_VERSION: ${{ steps.release.outputs.version }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build release zip
        run: ./gradlew --no-daemon --no-configuration-cache clean test buildPlugin

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          ZIP="build/distributions/canton-jetbrains-plugin-${{ steps.release.outputs.version }}.zip"
          if [[ ! -f "$ZIP" ]]; then
            echo "Expected plugin zip not found: $ZIP" >&2
            ls -la build/distributions >&2
            exit 1
          fi
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$ZIP.sha256" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Canton/DAML JetBrains Plugin ${{ steps.release.outputs.version }}

          Install the zip in a JetBrains IDE with:

          **Settings -> Plugins -> Install Plugin from Disk...**

          Download the `.zip` asset below. The `.sha256` file can be used to verify the download.
          EOF

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ZIP: packages/canton-jetbrains-plugin/${{ steps.assets.outputs.zip }}
          SHA: packages/canton-jetbrains-plugin/${{ steps.assets.outputs.sha }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        working-directory: .
        run: |
          PRERELEASE_FLAG=()
          if [[ "$PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" \
              --title "Canton/DAML JetBrains Plugin ${{ steps.release.outputs.version }}" \
              --notes-file packages/canton-jetbrains-plugin/release-notes.md \
              --target "$GITHUB_SHA" \
              "${PRERELEASE_FLAG[@]}"
          fi
