name: Test DevContainers

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        variant: [stable, latest]
    steps:
      - uses: actions/checkout@v6

      - name: Extract devcontainer build config
        id: config
        run: |
          DEVCONTAINER_DIR="packages/canton-devenv-start/templates/.devcontainer/${{ matrix.variant }}"
          DEVCONTAINER_JSON="${DEVCONTAINER_DIR}/devcontainer.json"

          VERSION=$(jq -r '.build.args.DAML_SDK_VERSION' "$DEVCONTAINER_JSON")
          DOCKERFILE=$(jq -r '.build.dockerfile' "$DEVCONTAINER_JSON")
          CONTEXT=$(jq -r '.build.context' "$DEVCONTAINER_JSON")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dockerfile=$(realpath -m "${DEVCONTAINER_DIR}/${DOCKERFILE}")" >> $GITHUB_OUTPUT
          echo "context=$(realpath -m "${DEVCONTAINER_DIR}/${CONTEXT}")" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.variant }}
        run: |
          docker build \
            --build-arg DAML_SDK_VERSION=${{ steps.config.outputs.version }} \
            -f "${{ steps.config.outputs.dockerfile }}" \
            "${{ steps.config.outputs.context }}"
