name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update version
        working-directory: packages/canton-devenv-start
        run: jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Create tarball
        working-directory: packages/canton-devenv-start
        run: |
          npm pack
          mv canton-devenv-start-*.tgz devenv-$VERSION.tgz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/canton-devenv-start/devenv-${{ env.VERSION }}.tgz
